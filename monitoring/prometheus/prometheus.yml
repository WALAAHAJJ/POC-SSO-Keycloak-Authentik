global:
  scrape_interval: 5s       # court pour voir réagir les graphes pendant les tests
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- Brokers -----------------------------------------------------------
  # Lag des consumer groups, offsets, partitions (conteneur kafka-exporter de compose.kafka.yml)
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # RabbitMQ : à ajouter plus tard (plugin prometheus intégré, port 15692)
  # - job_name: rabbitmq
  #   static_configs:
  #     - targets: ["rabbitmq:15692"]

  # --- Microservices Spring (lancés sur l'hôte) ---------------------------
  # Métriques Micrometer : JVM, HTTP, et clients Kafka (producer/consumer).
  # Le label "application" est ajouté par les services eux-mêmes (management.metrics.tags.application).
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082   # commande-service
          - host.docker.internal:8084   # notification-service
