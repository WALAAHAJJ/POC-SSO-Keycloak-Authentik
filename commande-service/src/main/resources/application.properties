spring.application.name=commande-service
server.port=8082
# URL du catalog-service (surchargeable : CATALOG_SERVICE_URL=http://... )
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}
paiement.service.url=${PAIEMENT_SERVICE_URL:http://localhost:8083}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

poc.messaging.broker=kafka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.template.observation-enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}