# Kafka en mode KRaft (sans ZooKeeper), 1 seul nœud : suffisant pour un POC.
#
# Deux listeners pour que ça marche à la fois depuis l'hôte et depuis Docker :
#   - EXTERNAL  localhost:9092  -> services Spring lancés sur ta machine (IDE / mvnw)
#   - INTERNAL  kafka:19092     -> conteneurs (kafka-exporter, kafka-ui, services dockerisés plus tard)
#
# Lancement (avec supervision) :
#   docker compose -f compose.kafka.yml -f compose.monitoring.yml up -d
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: poc-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 1 seul broker : tous les facteurs de réplication à 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # La création des topics est faite par les services Spring (bean NewTopic)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Exporte vers Prometheus : topics, offsets et lag des consumer groups
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: poc-kafka-exporter
    command:
      - --kafka.server=kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Interface web pour voir topics, messages et consumer groups : http://localhost:8090
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: poc-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: poc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
