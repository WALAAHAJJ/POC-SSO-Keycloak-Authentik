http:
  middlewares:
    cors:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:8081"
          - "http://localhost:8082"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
        accessControlAllowCredentials: true
        addVaryHeader: true
    strip-api:
      stripPrefix:
        prefixes:
          - /api
    # rate-limit:
    #   rateLimit:
    #     average: 5
    #     burst: 5
    #     period: 1s
  routers:
    catalogue-router:
      rule: "PathPrefix(`/api/products`)"
      service: catalogue-service
      entryPoints:
        - web
      middlewares:
        - cors
        - strip-api
        # - rate-limit
    commande-router:
      rule: "PathPrefix(`/api/commandes`)"
      service: commande-service
      entryPoints:
        - web
      middlewares:
        - cors
        - strip-api
    paiement-router:
      rule: "PathPrefix(`/api/paiements`)"
      service: paiement-service
      entryPoints:
        - web
      middlewares:
        - cors
        - strip-api
    notification-router:
      rule: "PathPrefix(`/api/notifications`)"
      service: notification-service
      entryPoints:
        - web
      middlewares:
        - cors
        - strip-api
  services:
    catalogue-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8081
    commande-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8082
    paiement-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8083
    notification-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8084
