# Prometheus + Grafana, partagés par les tests Kafka et (plus tard) RabbitMQ.
#
# Lancement :
#   docker compose -f compose.monitoring.yml up -d                          # supervision seule
#   docker compose -f compose.kafka.yml -f compose.monitoring.yml up -d     # Kafka + supervision
#
# Prometheus : http://localhost:9090      Grafana : http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: poc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Les services Spring tournent sur l'hôte : indispensable sous Linux, sans effet sous Docker Desktop
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: poc-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
