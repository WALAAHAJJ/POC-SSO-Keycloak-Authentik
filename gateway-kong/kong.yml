_format_version: "3.0"
_transform: true

services:
  - name: catalogue-service
    url: http://catalogue-upstream/products
    retries: 1
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: catalogue-router
        paths:
          - /api/products
        strip_path: true
        protocols:
          - http

  - name: commande-service
    url: http://host.docker.internal:8082/commandes
    routes:
      - name: commande-router
        paths:
          - /api/commandes
        strip_path: true
        protocols:
          - http

  - name: paiement-service
    url: http://host.docker.internal:8083/paiements
    routes:
      - name: paiement-router
        paths:
          - /api/paiements
        strip_path: true
        protocols:
          - http

  - name: notification-service
    url: http://host.docker.internal:8084/notifications
    routes:
      - name: notification-router
        paths:
          - /api/notifications
        strip_path: true
        protocols:
          - http

upstreams:
  - name: catalogue-upstream
    algorithm: round-robin
    targets:
      - target: host.docker.internal:8081
        weight: 100

    healthchecks:
      active:
        type: http
        http_path: /products
        timeout: 2

        healthy:
          interval: 5
          successes: 2
          http_statuses:
            - 200

        unhealthy:
          interval: 5
          tcp_failures: 2
          timeouts: 2
          http_failures: 2
          http_statuses:
            - 500
            - 502
            - 503
            - 504

      passive:
        healthy:
          successes: 2

        unhealthy:
          tcp_failures: 2
          timeouts: 2
          http_failures: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504
